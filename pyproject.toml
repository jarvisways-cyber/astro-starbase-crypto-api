[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-intelligence"
version = "0.7.0"
description = "Python/stdio MCP server and SDK for ASTRO hosted crypto intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JARVIS" }]
keywords = ["crypto", "trading", "market-data", "api-client", "oracle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23"]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
astro-mcp = "astro_intelligence.mcp_server:main"

[project.urls]
Homepage = "https://64.227.50.56"
Repository = "https://github.com/jarvisways-cyber/astro-starbase-crypto-api"
Issues = "https://github.com/jarvisways-cyber/astro-starbase-crypto-api/issues"

[tool.setuptools.packages.find]
include = ["astro_intelligence*"]
