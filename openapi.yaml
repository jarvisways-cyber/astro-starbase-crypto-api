  "components": {
    "securitySchemes": {
      "ApiKeyHeader": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key"
      }
    },
    "schemas": {
      "Signal": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "composite": {
            "type": "number",
            "nullable": true
          },
          "regime": {
            "type": "string"
          },
          "shift": {
            "type": "number",
            "nullable": true
          },
          "btc_price": {
            "type": "number",
            "nullable": true
          },
          "signals": {
