          }
        }
      },
      "Basket": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "basket": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/Asset"
            }
          },
          "stale": {
            "type": "boolean"
          },
          "regime": {
            "type": "string"
          }
