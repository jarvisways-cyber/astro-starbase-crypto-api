{
  "openapi": "3.0.3",
  "info": {
    "title": "ASTRO hosted crypto intelligence API",
    "version": "0.2.0",
    "description": "Core shape of the three hosted routes, not a closed enumeration of all additive intelligence fields. See docs/API.md. Scores are not calibrated profit probabilities."
  },
  "servers": [
    {
      "url": "https://astro-event-horizon.vercel.app"
    }
  ],
  "security": [
    {
      "ApiKeyHeader": []
    }
  ],
  "paths": {
    "/api/signal": {
      "get": {
        "operationId": "getSignal",
        "description": "One request per resource per key every 900 seconds. Inspect timestamps, stale flags and quality metadata; collection is not proof of every source freshness.",
        "responses": {
          "200": {
            "description": "Intelligence response; missing values may be null. Additional fields are retained.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Signal"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid access"
          },
          "403": {
            "description": "Access denied"
          },
          "429": {
            "description": "Resource polling limit reached"
          },
          "502": {
            "description": "Upstream unavailable"
          },
          "503": {
            "description": "Service or authorization snapshot unavailable"
          }
        }
      }
    },
    "/api/context": {
      "get": {
        "operationId": "getContext",
        "description": "One request per resource per key every 900 seconds. Inspect timestamps, stale flags and quality metadata; collection is not proof of every source freshness.",
        "responses": {
          "200": {
            "description": "Intelligence response; missing values may be null. Additional fields are retained.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Context"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid access"
          },
          "403": {
            "description": "Access denied"
          },
          "429": {
            "description": "Resource polling limit reached"
          },
          "502": {
            "description": "Upstream unavailable"
          },
          "503": {
            "description": "Service or authorization snapshot unavailable"
          }
        }
      }
    },
    "/api/basket": {
      "get": {
        "operationId": "getBasket",
        "description": "One request per resource per key every 900 seconds. Inspect timestamps, stale flags and quality metadata; collection is not proof of every source freshness.",
        "responses": {
          "200": {
            "description": "Intelligence response; missing values may be null. Additional fields are retained.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Basket"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid access"
          },
          "403": {
            "description": "Access denied"
          },
          "429": {
            "description": "Resource polling limit reached"
          },
          "502": {
            "description": "Upstream unavailable"
          },
          "503": {
            "description": "Service or authorization snapshot unavailable"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "ApiKeyHeader": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key"
      }
    },
    "schemas": {
      "Signal": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "composite": {
            "type": "number",
            "nullable": true
          },
          "regime": {
            "type": "string"
          },
          "shift": {
            "type": "number",
            "nullable": true
          },
          "btc_price": {
            "type": "number",
            "nullable": true
          },
          "signals": {
            "type": "object",
            "additionalProperties": true
          },
          "last_updated": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "Context": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "signal_explanation": {
            "type": "object",
            "additionalProperties": true
          },
          "market_intelligence": {
            "type": "object",
            "additionalProperties": true
          },
          "intelligence": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "Basket": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "basket": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/Asset"
            }
          },
          "stale": {
            "type": "boolean"
          },
          "regime": {
            "type": "string"
          }
        }
      },
      "Asset": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "price": {
            "type": "number",
            "nullable": true
          },
          "ascendancy": {
            "type": "number",
            "nullable": true
          },
          "velocity": {
            "type": "number",
            "nullable": true
          },
          "sma200": {
            "type": "number",
            "nullable": true
          },
          "above_sma200": {
            "type": "boolean",
            "nullable": true
          },
          "stale": {
            "type": "boolean"
          },
          "price_stale": {
            "type": "boolean"
          },
          "gate": {
            "type": "string"
          },
          "decision": {
            "type": "object",
            "additionalProperties": true
          }
        }
      }
    }
  }
}
