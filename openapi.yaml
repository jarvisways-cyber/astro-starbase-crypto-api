          },
          "above_sma200": {
            "type": "boolean",
            "nullable": true
          },
          "stale": {
            "type": "boolean"
          },
          "price_stale": {
            "type": "boolean"
          },
          "gate": {
            "type": "string"
          },
          "decision": {
            "type": "object",
